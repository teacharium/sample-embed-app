<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <title>Meridian · Teacharium sample embed app</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Exported widget bundles import "react" and "react-dom" as bare modules.
      This import map points them at tiny shims that re-export the app's own
      React (set on window in src/main.tsx), so widgets and the player share
      one React instance. It must come before any module script.
      Vite fills in the BASE_URL placeholders, so the app also works under a sub-path.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "%BASE_URL%react-shim.js",
          "react-dom": "%BASE_URL%react-dom-shim.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
